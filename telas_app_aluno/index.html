<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarIO - Orientador Vocacional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #f0f2f5; 
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
        }

        .message { padding: 10px 14px; border-radius: 12px; font-size: 15px; max-width: 85%; line-height: 1.4; }

        .mario-msg { 
            align-self: flex-start; 
            background: #f1f1f1; 
            color: #1a1a1a; 
            display: flex; 
            gap: 8px;
        }

        .mario-msg img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

        .user-msg { 
            align-self: flex-end; 
            background: #4f46e5; 
            color: white; 
            border-bottom-right-radius: 2px;
        }

        #input-area {
            padding: 15px;
            background: #f9f9f9;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .typing { font-size: 12px; color: #888; font-style: italic; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <img src="mario.png" class="header-img" alt="MarIO">
        <div>
            <p style="font-weight: bold;">MarIO</p>
            <p style="font-size: 12px; opacity: 0.8;">Guia Vocacional I/O</p>
        </div>
    </div>

    <div id="chat-box">
        <div class="message mario-msg">
            <img src="mario.png">
            <div>Olá! Sou o MarIO. Vamos descobrir seu caminho profissional? Primeiro, como você se chama?</div>
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Digite aqui..." autofocus>
        <button onclick="enviar()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('user-input');

    async function enviar() {
        const texto = input.value.trim();
        if (!texto) return;

        // Add User Message
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-msg';
        userDiv.textContent = texto;
        chatBox.appendChild(userDiv);
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Add Typing Indicator
        const typing = document.createElement('div');
        typing.className = 'message mario-msg typing';
        typing.id = 'temp-typing';
        typing.innerHTML = '<img src="mario.png"> <span>MarIO está analisando...</span>';
        chatBox.appendChild(typing);

        try {
            const response = await fetch('http://127.0.0.1:8000/conversar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ texto: texto })
            });
            const data = await response.json();
            
            document.getElementById('temp-typing').remove();

            // Add MarIO Response
            const marioDiv = document.createElement('div');
            marioDiv.className = 'message mario-msg';
            marioDiv.innerHTML = `<img src="mario.png"> <div>${data.resposta}</div>`;
            chatBox.appendChild(marioDiv);
            
        } catch (e) {
            document.getElementById('temp-typing').remove();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message mario-msg';
            errorDiv.textContent = "MarIO: Tive um problema no meu sistema I/O. Pode repetir?";
            chatBox.appendChild(errorDiv);
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') enviar(); });
</script>

</body>
</html>
