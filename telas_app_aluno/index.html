<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Vocacional IA - Autoconhecimento e Carreiras</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ESTILOS GERAIS E FUNDO CLARO COM ÍCONES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* DESCRIÇÃO DO FUNDO: Um padrão contínuo de pequenos ícones de profissões diversos e suaves (image_6.png, image_7.png, image_12.png, image_13.png), como estetoscópio, capacete de obra, chapéu de chef, paleta de artista e microscópio, em tons de cinza muito claro (transparente a 50%), repetindo-se sobre um fundo branco ou cinza claro (#f9f9f9), criando uma textura visual sutil que remete a carreiras. */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="%23f0f0f0" fill-opacity="0.5"><path d="M12 1a2 2 0 100 4a2 2 0 000-4zm4 6a2 2 0 100 4a2 2 0 000-4zm-8 4a2 2 0 100 4a2 2 0 000-4zm12 4a2 2 0 100 4a2 2 0 000-4zM8 19a2 2 0 100 4a2 2 0 000-4zm8 4a2 2 0 100 4a2 2 0 000-4zm-8 4a2 2 0 100 4a2 2 0 000-4zm12 4a2 2 0 100 4a2 2 0 000-4z"/></g></svg>'); /* Padrão sutil SVG placeholder */
            background-color: #f9f9f9;
            background-repeat: repeat;
        }

        /* --- TELA DO CHAT --- */
        #chat-container {
            width: 420px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CABEÇALHO DO CHAT --- */
        #chat-header {
            background-color: #4f46e5;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        #chat-header i {
            font-size: 24px;
            margin-right: 15px;
        }

        #chat-title {
            font-weight: bold;
            font-size: 18px;
        }

        /* --- ÁREA DAS MENSAGENS --- */
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: white;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo das bolhas */
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Guia Vocacional (Esquerda) */
        .guide-message {
            align-self: flex-start;
            background-color: #f1f1f1;
            color: #333;
            display: flex;
            align-items: flex-start;
        }

        .guide-message i {
            margin-right: 10px;
            color: #4f46e5;
            font-size: 18px;
            margin-top: 2px;
        }

        /* Usuário (Direita) */
        .user-message {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-top-right-radius: 2px;
        }

        /* Mensagem de erro */
        .error-message {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            text-align: center;
            max-width: 90%;
            align-self: center;
        }

        /* --- ÁREA DE ENTRADA --- */
        #input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background-color: #f9f9f9;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #user-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        #send-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn:hover {
            background-color: #4338ca;
        }

    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">
            <i class="fa-solid fa-user-graduate"></i>
            <div>
                <div id="chat-title">Guia Vocacional IA</div>
                <div style="font-size: 12px; color: #a5b4fc;">Online</div>
            </div>
        </div>

        <div id="chat-box">
            <div class="message guide-message">
                <i class="fa-solid fa-user-graduate"></i>
                <div>Olá! Sou o seu Guia Vocacional IA. Vamos iniciar sua jornada de autoconhecimento? Como posso te chamar?</div>
            </div>
            </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Digite seu nome ou resposta aqui...">
            <button id="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Função para adicionar uma mensagem do Guia
        function appendGuideMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message guide-message';
            
            const icon = document.createElement('i');
            icon.className = 'fa-solid fa-user-graduate';
            
            const content = document.createElement('div');
            content.innerText = text;
            
            messageDiv.appendChild(icon);
            messageDiv.appendChild(content);
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        // Função para adicionar uma mensagem do Usuário
        function appendUserMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        // Função para adicionar uma mensagem de erro
        function appendErrorMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message error-message';
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        // Função para rolar o chat para o fim
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- LÓGICA DE ENVIO E CONEXÃO COM O BACKEND (PYTHON) ---
        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return; // Não envia vazio

            // 1. Mostra a mensagem do usuário na tela
            appendUserMessage(message);
            
            // 2. Limpa o campo de entrada
            userInput.value = '';

            // 3. Adiciona um indicador visual de "digitando..." (Opcional, mas melhora a experiência)
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'message guide-message';
            typingIndicator.id = 'typing-indicator';
            typingIndicator.innerHTML = '<i class="fa-solid fa-user-graduate"></i><div>Pensando...</div>';
            chatBox.appendChild(typingIndicator);
            scrollToBottom();

            // 4. Faz a chamada POST para o servidor Python local
            try {
                const response = await fetch('http://127.0.0.1:8000/conversar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ "texto": message })
                });

                if (!response.ok) {
                    throw new Error('Falha na conexão com o servidor.');
                }

                const data = await response.json();

                // Remove o indicador "digitando"
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();

                // 5. Mostra a resposta do Guia (IA) na tela
                appendGuideMessage(data.resposta);

            } catch (error) {
                // Remove o indicador "digitando"
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
                
                console.error(error);
                appendErrorMessage('Ops, tive um probleminha técnico. Pode repetir o que disse?');
            }
        }

        // --- EVENT LISTENERS (CLIQUE E ENTER) ---
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

    </script>
</body>
</html>
